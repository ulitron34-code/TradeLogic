name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install dependencies
        run: timeout 10m pnpm install --frozen-lockfile --reporter=append-only --network-concurrency=4
      - name: Generate Prisma client
        run: pnpm --filter @platform/db prisma:generate
      - name: Verify repository structure
        run: pnpm verify:structure
      - name: Run shell preflight
        run: pnpm preflight:sh
      - name: Validate production smoke script
        run: |
          node --check scripts/smoke-production.cjs
          node scripts/smoke-production.cjs --help
          node --check scripts/smoke-authenticated.cjs
          node scripts/smoke-authenticated.cjs --help
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
